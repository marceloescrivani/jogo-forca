<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca PWA P2P</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <!-- Biblioteca externa para geração de QR Code local -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; margin-bottom: 20px; }
    h1, h2, h3 { color: #2c3e50; margin-top: 0; }
    .status-bar { display: flex; justify-content: space-between; background: #ecf0f1; padding: 10px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
    .word-display { display: flex; justify-content: center; gap: 8px; margin: 25px 0; flex-wrap: wrap; }
    .letter-box { width: 38px; height: 45px; border-bottom: 3px solid #2c3e50; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; text-transform: uppercase; background: #eef2f5; border-radius: 4px 4px 0 0; }
    input[type="text"], input[type="number"], textarea { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 6px; text-align: center; margin-bottom: 15px; text-transform: uppercase; }
    button { background-color: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; margin-bottom: 10px; }
    button:hover { background-color: #219150; }
    button.secondary { background-color: #2980b9; }
    button.secondary:hover { background-color: #1f6391; }
    .chances { color: #c0392b; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
    .hidden { display: none; }
    .used-letters { font-size: 14px; color: #7f8c8d; margin-top: 10px; word-break: break-all; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; }

    /* ESTILOS DO TECLADO VIRTUAL MOBILE */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 15px;
      width: 100%;
    }
    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .key-btn {
      background-color: #2c3e50;
      color: white;
      border: none;
      padding: 10px 0;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      max-width: 38px;
      margin-bottom: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .key-btn:active {
      transform: scale(0.95);
    }
    .key-btn:disabled {
      background-color: #bdc3c7 !important;
      color: #7f8c8d;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <!-- TELA 1: CONFIGURAÇÃO DE SALA E PAREAMENTO -->
  <div class="card" id="setup-screen">
    <h1>Jogo da Forca PWA</h1>
    <p>Conexão P2P (Wi-Fi Local)</p>
    
    <label for="total-rounds">Quantidade
