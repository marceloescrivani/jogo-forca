<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca PWA - Passa & Joga</title>
  <meta name="theme-color" content="#2c3e50">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; position: relative; }
    h1 { color: #2c3e50; margin-top: 0; font-size: 24px; }
    p { margin-bottom: 15px; color: #666; font-size: 14px; }
    .status-bar { display: flex; justify-content: space-between; background: #ecf0f1; padding: 10px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
    .word-display { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .letter-box { width: 36px; height: 42px; border-bottom: 3px solid #2c3e50; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; text-transform: uppercase; background: #eef2f5; border-radius: 4px 4px 0 0; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 6px; text-align: center; margin-bottom: 12px; text-transform: uppercase; }
    button { background-color: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; margin-bottom: 10px; }
    button:hover { background-color: #219150; }
    button.danger { background-color: #c0392b; }
    button.danger:hover { background-color: #a93226; }
    .chances { color: #c0392b; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
    .hidden { display: none !important; }
    .used-letters { font-size: 14px; color: #7f8c8d; margin-top: 10px; word-break: break-all; }
    
    /* TECLADO VIRTUAL */
    .keyboard { display: flex; flex-direction: column; gap: 6px; margin-top: 15px; width: 100%; }
    .keyboard-row { display: flex; justify-content: center; gap: 4px; }
    .key-btn { background-color: #2c3e50; color: white; border: none; padding: 10px 0; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; max-width: 38px; margin-bottom: 0; }
    .key-btn:disabled { background-color: #bdc3c7 !important; color: #7f8c8d; cursor: not-allowed; opacity: 0.6; }

    /* ANIMACAO DO X VERMELHO */
    .error-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 110px;
      color: #e74c3c;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
      animation: popFade 0.9s forwards;
    }

    @keyframes popFade {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div id="error-popup-container"></div>

    <h1>Jogo da Forca (Passa & Joga)</h1>

    <!-- BARRA DE PLACAR E RODADA -->
    <div class="status-bar">
      <span>Rodada <span id="current-round">1</span></span>
      <span>Placar: J1 (<span id="score-j1">0</span>) x (<span id="score-j2">0</span>) J2</span>
    </div>

    <div id="role-turn-info" style="font-weight: 600; color: #2980b9; margin-bottom: 12px; font-size: 15px;"></div>

    <!-- ETAPA 1: DIGITAR PALAVRA -->
    <div id="maker-section">
      <p style="font-size: 13px; color: #555;">Digite a palavra secreta abaixo e passe o smartphone:</p>
      <input type="password" id="secret-word-input" placeholder="PALAVRA SECRETA" autocomplete="off">
      <button id="btn-set-word" type="button">Ocultar e Passar Aparelho</button>
    </div>

    <!-- ETAPA 2: ADIVINHAR PALAVRA -->
    <div id="guesser-section" class="hidden">
      <div class="chances">Erros restantes: <span id="errors-left">5</span>/5</div>
      <div class="word-display" id="word-display"></div>

      <!-- TECLADO VIRTUAL QWERTY -->
      <div class="keyboard" id="keyboard">
        <div class="keyboard-row">
          <button class="key-btn" type="button" data-key="Q">Q</button>
          <button class="key-btn" type="button" data-key="W">W</button>
          <button class="key-btn" type="button" data-key="E">E</button>
          <button class="key-btn" type="button" data-key="R">R</button>
          <button class="key-btn" type="button" data-key="T">T</button>
          <button class="key-btn" type="button" data-key="Y">Y</button>
          <button class="key-btn" type="button" data-key="U">U</button>
          <button class="key-btn" type="button" data-key="I">I</button>
          <button class="key-btn" type="button" data-key="O">O</button>
          <button class="key-btn" type="button" data-key="P">P</button>
        </div>
        <div class="keyboard-row">
          <button class="key-btn" type="button" data-key="A">A</button>
          <button class="key-btn" type="button" data-key="S">S</button>
          <button class="key-btn" type="button" data-key="D">D</button>
          <button class="key-btn" type="button" data-key="F">F</button>
          <button class="key-btn" type="button" data-key="G">G</button>
          <button class="key-btn" type="button" data-key="H">H</button>
          <button class="key-btn" type="button" data-key="J">J</button>
          <button class="key-btn" type="button" data-key="K">K</button>
          <button class="key-btn" type="button" data-key="L">L</button>
          <button class="key-btn" type="button" data-key="Ç">Ç</button>
        </div>
        <div class="keyboard-row">
          <button class="key-btn" type="button" data-key="Z">Z</button>
          <button class="key-btn" type="button" data-key="X">X</button>
          <button class="key-btn" type="button" data-key="C">C</button>
          <button class="key-btn" type="button" data-key="V">V</button>
          <button class="key-btn" type="button" data-key="B">B</button>
          <button class="key-btn" type="button" data-key="N">N</button>
          <button class="key-btn" type="button" data-key="M">M</button>
        </div>
      </div>

      <div class="used-letters">Letras tentadas: <span id="used-letters-list">-</span></div>
    </div>

    <!-- BOTAO DE ENCERRAMENTO -->
    <button id="btn-end-game" type="button" class="danger" style="margin-top: 20px;">Encerrar Jogo e Ver Vencedor</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentRound = 1;
      let scoreJ1 = 0;
      let scoreJ2 = 0;
      let currentMaker = 1; // 1: J1 escolhe / J2 adivinha | 2: J2 escolhe / J1 adivinha
      let secretWord = "";
      let guessedLetters = [];
      let errorCount = 0;
      const MAX_ERRORS = 5;

      const roleTurnInfo = document.getElementById('role-turn-info');
      const makerSection = document.getElementById('maker-section');
      const guesserSection = document.getElementById('guesser-section');
      const secretWordInput = document.getElementById('secret-word-input');
      const btnSetWord = document.getElementById('btn-set-word');
      const btnEndGame = document.getElementById('btn-end-game');
      const wordDisplay = document.getElementById('word-display');
      const errorsLeftSpan = document.getElementById('errors-left');
      const usedLettersList = document.getElementById('used-letters-list');
      const errorPopupContainer = document.getElementById('error-popup-container');

      function startRound() {
        secretWord = "";
        guessedLetters = [];
        errorCount = 0;
        secretWordInput.value = "";
        usedLettersList.textContent = "-";
        errorsLeftSpan.textContent = MAX_ERRORS;

        document.querySelectorAll('.key-btn').forEach(btn => btn.disabled = false);

        document.getElementById('current-round').textContent = currentRound;
        document.getElementById('score-j1').textContent = scoreJ1;
        document.getElementById('score-j2').textContent = scoreJ2;

        const guesser = currentMaker === 1 ? 2 : 1;
        roleTurnInfo.textContent = `Vez de Jogador ${currentMaker} escrever a palavra`;

        makerSection.classList.remove('hidden');
        guesserSection.classList.add('hidden');
      }

      btnSetWord.addEventListener('click', () => {
        const val = secretWordInput.value.trim().toUpperCase();
        if (!val || !/^[A-ZÁÀÂÃÉÈÊÍÏÓÔÕÖÚÇÑ]+$/i.test(val)) {
          alert("Por favor, digite apenas letras.");
          return;
        }

        secretWord = val;
        const guesser = currentMaker === 1 ? 2 : 1;
        
        makerSection.classList.add('hidden');
        guesserSection.classList.remove('hidden');
        roleTurnInfo.textContent = `Vez de Jogador ${guesser} adivinhar!`;

        renderWordDisplay();
      });

      document.querySelectorAll('.key-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const letter = btn.getAttribute('data-key');
          if (!letter || guessedLetters.includes(letter)) return;

          guessedLetters.push(letter);
          btn.disabled = true;
          usedLettersList.textContent = guessedLetters.join(", ");

          if (secretWord.includes(letter)) {
            renderWordDisplay();
          } else {
            showRedX();
            if (navigator.vibrate) navigator.vibrate(200);

            errorCount++;
            errorsLeftSpan.textContent = MAX_ERRORS - errorCount;

            if (errorCount >= MAX_ERRORS) {
              setTimeout(() => endRound(false), 500);
            }
          }
        });
      });

      function renderWordDisplay() {
        wordDisplay.innerHTML = "";
        let hasWon = true;

        for (let char of secretWord) {
          const box = document.createElement('div');
          box.className = 'letter-box';

          if (guessedLetters.includes(char)) {
            box.textContent = char;
          } else {
            box.textContent = "";
            hasWon = false;
          }
          wordDisplay.appendChild(box);
        }

        if (hasWon && secretWord.length > 0) {
          setTimeout(() => endRound(true), 400);
        }
      }

      function showRedX() {
        const xDiv = document.createElement('div');
        xDiv.className = 'error-popup';
        xDiv.textContent = '✖';
        errorPopupContainer.appendChild(xDiv);

        setTimeout(() => {
          if (xDiv.parentNode) xDiv.parentNode.removeChild(xDiv);
        }, 900);
      }

      function endRound(guesserWon) {
        const guesser = currentMaker === 1 ? 2 : 1;
        let msg = "";

        if (guesserWon) {
          msg = `Parabéns! O Jogador ${guesser} acertou a palavra "${secretWord}" e pontuou!`;
          if (guesser === 1) scoreJ1++; else scoreJ2++;
        } else {
          msg = `Fim das tentativas! O Jogador ${guesser} errou 5 vezes. O Jogador ${currentMaker} pontuou!\nA palavra era: "${secretWord}".`;
          if (currentMaker === 1) scoreJ1++; else scoreJ2++;
        }

        alert(msg);

        // Alterna quem escreve na próxima rodada
        currentRound++;
        currentMaker = currentMaker === 1 ? 2 : 1;
        startRound();
      }

      btnEndGame.addEventListener('click', () => {
        let winnerMsg = "";
        if (scoreJ1 > scoreJ2) {
          winnerMsg = "🏆 JOGADOR 1 É O CAMPEÃO!";
        } else if (scoreJ2 > scoreJ1) {
          winnerMsg = "🏆 JOGADOR 2 É O CAMPEÃO!";
        } else {
          winnerMsg = "🤝 O JOGO TERMINOU EMPATADO!";
        }

        alert(`JOGO ENCERRADO!\n\nPlacar Final após ${currentRound - 1} rodada(s):\nJogador 1: ${scoreJ1} ponto(s)\nJogador 2: ${scoreJ2} ponto(s)\n\n${winnerMsg}`);
        
        currentRound = 1;
        scoreJ1 = 0;
        scoreJ2 = 0;
        currentMaker = 1;
        startRound();
      });

      startRound();
    });
  </script>
</body>
</html>
