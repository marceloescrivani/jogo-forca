<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca PWA</title>
  <meta name="theme-color" content="#2c3e50">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; position: relative; }
    h1 { color: #2c3e50; margin-top: 0; font-size: 24px; }
    p { margin-bottom: 15px; color: #666; font-size: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; text-align: left; font-size: 14px; }
    .status-bar { display: flex; justify-content: space-between; background: #ecf0f1; padding: 10px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
    .timer-bar { background: #ffeaa7; color: #d35400; padding: 8px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; font-size: 15px; }
    .hint-box { background: #e8f4f8; color: #2980b9; padding: 10px; border-radius: 6px; font-weight: 600; margin-bottom: 15px; font-size: 14px; border: 1px dashed #3498db; }
    .word-display { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .letter-box { width: 36px; height: 42px; border-bottom: 3px solid #2c3e50; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; text-transform: uppercase; background: #eef2f5; border-radius: 4px 4px 0 0; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; text-align: center; margin-bottom: 12px; background: #fff; }
    button { background-color: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; margin-bottom: 10px; }
    button:hover { background-color: #219150; }
    button.secondary { background-color: #2980b9; }
    button.secondary:hover { background-color: #1f6391; }
    button.danger { background-color: #c0392b; }
    button.danger:hover { background-color: #a93226; }
    .chances { color: #c0392b; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
    .hidden { display: none !important; }
    .used-letters { font-size: 14px; color: #7f8c8d; margin-top: 10px; word-break: break-all; }
    
    /* TECLADO VIRTUAL */
    .keyboard { display: flex; flex-direction: column; gap: 6px; margin-top: 15px; width: 100%; }
    .keyboard-row { display: flex; justify-content: center; gap: 4px; }
    .key-btn { background-color: #2c3e50; color: white; border: none; padding: 10px 0; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; max-width: 38px; margin-bottom: 0; }
    .key-btn:disabled { background-color: #bdc3c7 !important; color: #7f8c8d; cursor: not-allowed; opacity: 0.6; }

    /* ANIMAÇÃO DO X VERMELHO */
    .error-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 110px;
      color: #e74c3c;
      font-weight: bold;
      pointer-events: none;
      z-index: 10;
      animation: popFade 0.9s forwards;
    }

    @keyframes popFade {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div id="error-popup-container"></div>

    <h1>Jogo da Forca PWA</h1>

    <!-- PAINEL DE CONFIGURAÇÃO INICIAL -->
    <div id="setup-section">
      <label for="game-mode-select">Modo de Jogo:</label>
      <select id="game-mode-select">
        <option value="1P">1 Jogador (Contra o Sistema)</option>
        <option value="2P" selected>2 Jogadores (Passa & Joga)</option>
      </select>

      <div id="difficulty-group" class="hidden">
        <label for="difficulty-select">Dificuldade:</label>
        <select id="difficulty-select">
          <option value="easy">Fácil (7 Erros Permitidos)</option>
          <option value="medium" selected>Médio (5 Erros Permitidos)</option>
          <option value="hard">Difícil (3 Erros Permitidos)</option>
        </select>
      </div>

      <label for="total-rounds-input">Quantidade de Rodadas:</label>
      <input type="number" id="total-rounds-input" value="5" min="1" max="20">

      <label for="timer-select">Tempo limite por rodada:</label>
      <select id="timer-select">
        <option value="0">Sem Tempo Limite</option>
        <option value="30">30 Segundos</option>
        <option value="45" selected>45 Segundos</option>
        <option value="60">60 Segundos</option>
      </select>

      <button id="btn-start-game" type="button" class="secondary">Iniciar Partida</button>
    </div>

    <!-- ÁREA DO JOGO -->
    <div id="game-container" class="hidden">
      <!-- PLACAR E RODADA -->
      <div class="status-bar">
        <span>Rodada <span id="current-round">1</span>/<span id="max-rounds">5</span></span>
        <span id="score-text">Placar: J1 (0) x (0) J2</span>
      </div>

      <!-- CRONÓMETRO -->
      <div id="timer-container" class="timer-bar hidden">
        ⏱️ Tempo restante: <span id="timer-display">0</span>s
      </div>

      <div id="role-turn-info" style="font-weight: 600; color: #2980b9; margin-bottom: 12px; font-size: 15px;"></div>

      <!-- MODO 2P: ETAPA DE DIGITAR PALAVRA -->
      <div id="maker-section">
        <p style="font-size: 13px; color: #555;">Digite a palavra secreta e clique no botão para ocultar e passar o aparelho:</p>
        <input type="text" id="secret-word-input" placeholder="DIGITE A PALAVRA" autocomplete="off">
        <button id="btn-set-word" type="button">Ocultar e Passar Aparelho</button>
      </div>

      <!-- ETAPA DE ADIVINHAR -->
      <div id="guesser-section" class="hidden">
        <div id="hint-display" class="hint-box hidden">💡 Dica: <span id="hint-text"></span></div>
        <div class="chances">Erros restantes: <span id="errors-left">5</span>/<span id="max-errors-display">5</span></div>
        <div class="word-display" id="word-display"></div>

        <!-- TECLADO VIRTUAL QWERTY -->
        <div class="keyboard" id="keyboard">
          <div class="keyboard-row">
            <button class="key-btn" type="button" data-key="Q">Q</button>
            <button class="key-btn" type="button" data-key="W">W</button>
            <button class="key-btn" type="button" data-key="E">E</button>
            <button class="key-btn" type="button" data-key="R">R</button>
            <button class="key-btn" type="button" data-key="T">T</button>
            <button class="key-btn" type="button" data-key="Y">Y</button>
            <button class="key-btn" type="button" data-key="U">U</button>
            <button class="key-btn" type="button" data-key="I">I</button>
            <button class="key-btn" type="button" data-key="O">O</button>
            <button class="key-btn" type="button" data-key="P">P</button>
          </div>
          <div class="keyboard-row">
            <button class="key-btn" type="button" data-key="A">A</button>
            <button class="key-btn" type="button" data-key="S">S</button>
            <button class="key-btn" type="button" data-key="D">D</button>
            <button class="key-btn" type="button" data-key="F">F</button>
            <button class="key-btn" type="button" data-key="G">G</button>
            <button class="key-btn" type="button" data-key="H">H</button>
            <button class="key-btn" type="button" data-key="J">J</button>
            <button class="key-btn" type="button" data-key="K">K</button>
            <button class="key-btn" type="button" data-key="L">L</button>
            <button class="key-btn" type="button" data-key="Ç">Ç</button>
          </div>
          <div class="keyboard-row">
            <button class="key-btn" type="button" data-key="Z">Z</button>
            <button class="key-btn" type="button" data-key="X">X</button>
            <button class="key-btn" type="button" data-key="C">C</button>
            <button class="key-btn" type="button" data-key="V">V</button>
            <button class="key-btn" type="button" data-key="B">B</button>
            <button class="key-btn" type="button" data-key="N">N</button>
            <button class="key-btn" type="button" data-key="M">M</button>
          </div>
        </div>

        <div class="used-letters">Letras tentadas: <span id="used-letters-list">-</span></div>
      </div>

      <button id="btn-end-game" type="button" class="danger" style="margin-top: 20px;">Encerrar Jogo</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Banco de palavras para o Modo 1 Jogador
      const wordBank = {
        easy: [
          { word: "BANANA", hint: "Fruta amarela" },
          { word: "CACHORRO", hint: "Animal de estimação" },
          { word: "ESCOLA", hint: "Lugar de estudar" },
          { word: "FUTEBOL", hint: "Esporte com bola" },
          { word: "JANELA", hint: "Abertura na parede" },
          { word: "LIVRO", hint: "Usado para leitura" }
        ],
        medium: [
          { word: "COMPUTADOR", hint: "Equipamento eletrônico" },
          { word: "GIRAFA", hint: "Animal de pescoço comprido" },
          { word: "ALFROUXAR", hint: "Tornar menos tenso" },
          { word: "BIBLIOTECA", hint: "Local com acervo de livros" },
          { word: "CHOCOLATE", hint: "Doce feito de cacau" },
          { word: "METEOROLOGIA", hint: "Estudo do tempo e clima" }
        ],
        hard: [
          { word: "ARQUITETURA", hint: "Arte de projetar edifícios" },
          { word: "ESTETOSCOPIO", hint: "Instrumento médico de ausculta" },
          { word: "PARALELEPIPEDO", hint: "Pedra de calçamento" },
          { word: "REIVINDICACAO", hint: "Ato de exigir um direito" },
          { word: "INCONSTITUCIONAL", hint: "Que contraria a lei maior" }
        ]
      };

      let gameMode = "2P";
      let difficulty = "medium";
      let maxErrors = 5;
      let totalRounds = 5;
      let currentRound = 1;
      let scoreJ1 = 0;
      let scoreJ2 = 0;
      let currentMaker = 1;
      let secretWord = "";
      let currentHint = "";
      let guessedLetters = [];
      let errorCount = 0;
      
      let timerSeconds = 0;
      let timerInterval = null;
      let timeLeft = 0;

      const gameModeSelect = document.getElementById('game-mode-select');
      const difficultyGroup = document.getElementById('difficulty-group');
      const difficultySelect = document.getElementById('difficulty-select');
      const totalRoundsInput = document.getElementById('total-rounds-input');
      const timerSelect = document.getElementById('timer-select');
      const btnStartGame = document.getElementById('btn-start-game');

      const setupSection = document.getElementById('setup-section');
      const gameContainer = document.getElementById('game-container');
      const scoreText = document.getElementById('score-text');
      const timerContainer = document.getElementById('timer-container');
      const timerDisplay = document.getElementById('timer-display');

      const roleTurnInfo = document.getElementById('role-turn-info');
      const makerSection = document.getElementById('maker-section');
      const guesserSection = document.getElementById('guesser-section');
      const secretWordInput = document.getElementById('secret-word-input');
      const btnSetWord = document.getElementById('btn-set-word');
      const btnEndGame = document.getElementById('btn-end-game');
      const hintDisplay = document.getElementById('hint-display');
      const hintText = document.getElementById('hint-text');
      const wordDisplay = document.getElementById('word-display');
      const errorsLeftSpan = document.getElementById('errors-left');
      const maxErrorsDisplay = document.getElementById('max-errors-display');
      const usedLettersList = document.getElementById('used-letters-list');
      const errorPopupContainer = document.getElementById('error-popup-container');

      // Alterna exibição do seletor de dificuldade
      gameModeSelect.addEventListener('change', () => {
        if (gameModeSelect.value === "1P") {
          difficultyGroup.classList.remove('hidden');
        } else {
          difficultyGroup.classList.add('hidden');
        }
      });

      // Iniciar a partida
      btnStartGame.addEventListener('click', () => {
        gameMode = gameModeSelect.value;
        difficulty = difficultySelect.value;
        totalRounds = parseInt(totalRoundsInput.value) || 5;
        timerSeconds = parseInt(timerSelect.value) || 0;

        if (gameMode === "1P") {
          if (difficulty === "easy") maxErrors = 7;
          else if (difficulty === "medium") maxErrors = 5;
          else if (difficulty === "hard") maxErrors = 3;
        } else {
          maxErrors = 5;
        }

        currentRound = 1;
        scoreJ1 = 0;
        scoreJ2 = 0;
        currentMaker = 1;

        document.getElementById('max-rounds').textContent = totalRounds;
        setupSection.classList.add('hidden');
        gameContainer.classList.remove('hidden');

        startRound();
      });

      function startRound() {
        clearInterval(timerInterval);
        secretWord = "";
        currentHint = "";
        guessedLetters = [];
        errorCount = 0;
        secretWordInput.value = "";
        usedLettersList.textContent = "-";
        errorsLeftSpan.textContent = maxErrors;
        maxErrorsDisplay.textContent = maxErrors;

        document.querySelectorAll('.key-btn').forEach(btn => btn.disabled = false);
        document.getElementById('current-round').textContent = currentRound;
        updateScoreBoard();

        if (gameMode === "1P") {
          // Escolhe palavra aleatória do banco
          const list = wordBank[difficulty];
          const item = list[Math.floor(Math.random() * list.length)];
          secretWord = item.word;
          currentHint = item.hint;

          makerSection.classList.add('hidden');
          guesserSection.classList.remove('hidden');
          hintDisplay.classList.remove('hidden');
          hintText.textContent = currentHint;
          roleTurnInfo.textContent = "Adivinhe a palavra secreta!";

          renderWordDisplay();
          startTimer();
        } else {
          // Modo 2P
          hintDisplay.classList.add('hidden');
          roleTurnInfo.textContent = `Vez de Jogador ${currentMaker} escrever a palavra`;
          makerSection.classList.remove('hidden');
          guesserSection.classList.add('hidden');
        }
      }

      function updateScoreBoard() {
        if (gameMode === "1P") {
          scoreText.textContent = `Pontos: ${scoreJ1}`;
        } else {
          scoreText.textContent = `Placar: J1 (${scoreJ1}) x (${scoreJ2}) J2`;
        }
      }

      // Modo 2P: Ocultar e passar aparelho
      btnSetWord.addEventListener('click', () => {
        const val = secretWordInput.value.trim().toUpperCase();
        if (!val || !/^[A-ZÁÀÂÃÉÈÊÍÏÓÔÕÖÚÇÑ]+$/i.test(val)) {
          alert("Por favor, digite apenas letras.");
          return;
        }

        secretWord = val;
        const guesser = currentMaker === 1 ? 2 : 1;
        
        makerSection.classList.add('hidden');
        guesserSection.classList.remove('hidden');
        roleTurnInfo.textContent = `Vez de Jogador ${guesser} adivinhar!`;

        renderWordDisplay();
        startTimer();
      });

      // Gestão do Cronómetro
      function startTimer() {
        if (timerSeconds <= 0) {
          timerContainer.classList.add('hidden');
          return;
        }

        timerContainer.classList.remove('hidden');
        timeLeft = timerSeconds;
        timerDisplay.textContent = timeLeft;

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timeLeft--;
          timerDisplay.textContent = timeLeft;

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            showRedX();
            alert(`O tempo acabou! A palavra era: "${secretWord}".`);
            endRound(false);
          }
        }, 1000);
      }

      // Clique no Teclado Virtual
      document.querySelectorAll('.key-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const letter = btn.getAttribute('data-key');
          if (!letter || guessedLetters.includes(letter)) return;

          guessedLetters.push(letter);
          btn.disabled = true;
          usedLettersList.textContent = guessedLetters.join(", ");

          if (secretWord.includes(letter)) {
            renderWordDisplay();
          } else {
            showRedX();
            if (navigator.vibrate) navigator.vibrate(200);

            errorCount++;
            errorsLeftSpan.textContent = maxErrors - errorCount;

            if (errorCount >= maxErrors) {
              clearInterval(timerInterval);
              setTimeout(() => endRound(false), 500);
            }
          }
        });
      });

      function renderWordDisplay() {
        wordDisplay.innerHTML = "";
        let hasWon = true;

        for (let char of secretWord) {
          const box = document.createElement('div');
          box.className = 'letter-box';

          if (guessedLetters.includes(char)) {
            box.textContent = char;
          } else {
            box.textContent = "";
            hasWon = false;
          }
          wordDisplay.appendChild(box);
        }

        if (hasWon && secretWord.length > 0) {
          clearInterval(timerInterval);
          setTimeout(() => endRound(true), 400);
        }
      }

      function showRedX() {
        const xDiv = document.createElement('div');
        xDiv.className = 'error-popup';
        xDiv.textContent = '✖';
        errorPopupContainer.appendChild(xDiv);

        setTimeout(() => {
          if (xDiv.parentNode) xDiv.parentNode.removeChild(xDiv);
        }, 900);
      }

      function endRound(guesserWon) {
        clearInterval(timerInterval);
        const guesser = currentMaker === 1 ? 2 : 1;
        let msg = "";

        if (gameMode === "1P") {
          if (guesserWon) {
            msg = `Parabéns! Você acertou a palavra "${secretWord}" e ganhou 1 ponto!`;
            scoreJ1++;
          } else {
            msg = `Que pena! Você errou a palavra. A palavra era: "${secretWord}".`;
          }
        } else {
          if (guesserWon) {
            msg = `Parabéns! O Jogador ${guesser} acertou a palavra "${secretWord}" e ganhou 1 ponto!`;
            if (guesser === 1) scoreJ1++; else scoreJ2++;
          } else {
            msg = `Fim das tentativas! O Jogador ${guesser} errou ou o tempo acabou.\nA palavra era: "${secretWord}".`;
          }
        }

        alert(msg);

        if (currentRound < totalRounds) {
          currentRound++;
          currentMaker = currentMaker === 1 ? 2 : 1;
          startRound();
        } else {
          finishGame();
        }
      }

      function finishGame() {
        clearInterval(timerInterval);
        let winnerMsg = "";

        if (gameMode === "1P") {
          winnerMsg = `Fim da Partida!\nVocê fez ${scoreJ1} ponto(s) em ${totalRounds} rodada(s)!`;
        } else {
          if (scoreJ1 > scoreJ2) winnerMsg = "🏆 JOGADOR 1 É O CAMPEÃO!";
          else if (scoreJ2 > scoreJ1) winnerMsg = "🏆 JOGADOR 2 É O CAMPEÃO!";
          else winnerMsg = "🤝 O JOGO TERMINOU EMPATADO!";

          winnerMsg = `PARTIDA FINALIZADA!\n\nPlacar Final após ${totalRounds} rodadas:\nJogador 1: ${scoreJ1} ponto(s)\nJogador 2: ${scoreJ2} ponto(s)\n\n${winnerMsg}`;
        }

        alert(winnerMsg);
        gameContainer.classList.add('hidden');
        setupSection.classList.remove('hidden');
      }

      btnEndGame.addEventListener('click', () => {
        if (confirm("Deseja realmente encerrar a partida agora?")) {
          finishGame();
        }
      });
    });
  </script>
</body>
</html>
