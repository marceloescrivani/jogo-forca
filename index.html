<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca PWA P2P</title>
  <meta name="theme-color" content="#2c3e50">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
    h1 { color: #2c3e50; margin-top: 0; font-size: 24px; }
    h2, h3 { color: #2c3e50; margin-top: 0; }
    p { margin-bottom: 15px; color: #666; font-size: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    .status-bar { display: flex; justify-content: space-between; background: #ecf0f1; padding: 10px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
    .word-display { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .letter-box { width: 36px; height: 42px; border-bottom: 3px solid #2c3e50; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; text-transform: uppercase; background: #eef2f5; border-radius: 4px 4px 0 0; }
    input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; font-size: 15px; border: 2px solid #bdc3c7; border-radius: 6px; text-align: center; margin-bottom: 12px; }
    textarea { font-family: monospace; font-size: 12px; resize: none; }
    button { background-color: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; margin-bottom: 10px; }
    button:hover { background-color: #219150; }
    button.secondary { background-color: #2980b9; }
    button.secondary:hover { background-color: #1f6391; }
    .chances { color: #c0392b; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
    .hidden { display: none !important; }
    .used-letters { font-size: 14px; color: #7f8c8d; margin-top: 10px; word-break: break-all; }

    /* TECLADO VIRTUAL */
    .keyboard { display: flex; flex-direction: column; gap: 6px; margin-top: 15px; width: 100%; }
    .keyboard-row { display: flex; justify-content: center; gap: 4px; }
    .key-btn { background-color: #2c3e50; color: white; border: none; padding: 10px 0; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; max-width: 38px; margin-bottom: 0; }
    .key-btn:disabled { background-color: #bdc3c7 !important; color: #7f8c8d; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card" id="setup-screen">
    <h1>Jogo da Forca PWA</h1>
    <p>Conexão Direta Sem Servidor (100% Offline)</p>
    
    <div id="initial-actions">
      <label for="total-rounds">Quantidade de Rodadas:</label>
      <input type="number" id="total-rounds" value="5" min="1" max="20">

      <button id="btn-create" type="button" class="secondary">Criar Sala (Jogador 1)</button>
      <button id="btn-join-mode" type="button">Entrar em uma Sala (Jogador 2)</button>
    </div>

    <!-- TELA JOGADOR 1 -->
    <div id="host-setup" class="hidden">
      <h3>Sua Sala foi Criada!</h3>
      <p>1. Copie e envie este código para o Jogador 2:</p>
      <textarea id="host-code-out" readonly rows="3" onclick="this.select()"></textarea>
      
      <p style="margin-top: 10px;">2. Cole aqui o código recebido do Jogador 2:</p>
      <textarea id="host-code-in" rows="3" placeholder="Cole o código do Jogador 2 aqui..."></textarea>
      <button id="btn-host-connect" type="button">Conectar e Jogar</button
